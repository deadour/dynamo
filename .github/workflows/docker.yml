name: Build images
on:
  push: {branches: [main]}
jobs:
  images:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with: {context: ./backend, push: true, tags: 'ghcr.io/${{ github.repository_owner }}/dynamo-backend:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/dynamo-backend:latest', labels: 'org.opencontainers.image.revision=${{ github.sha }}'}
      - uses: docker/build-push-action@v6
        with: {context: ./frontend, push: true, tags: 'ghcr.io/${{ github.repository_owner }}/dynamo-frontend:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/dynamo-frontend:latest', labels: 'org.opencontainers.image.revision=${{ github.sha }}'}
