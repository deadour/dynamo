name: Keep backend awake
# El plan gratis de Render duerme el backend tras ~15 min sin tráfico y despertarlo tarda ~1 minuto.
# Un ping cada 10 minutos lo mantiene despierto (un solo servicio entra en las 750 h gratis del mes).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 --retry 2 https://dynamo-kw6c.onrender.com/health/ -o /dev/null -w "%{http_code} %{time_total}s\n"
