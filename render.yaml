services:
  - type: web
    name: dynamo-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "0"
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: IMPORT_EXERCISES_ON_START
        value: "1"
      - key: ADMIN_EMAILS
        sync: false
  - type: web
    name: dynamo-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    # La API se sirve desde el mismo dominio que el front: así la cookie de sesión es propia
    # (onrender.com es un sufijo público y front/back en subdominios distintos cuentan como sitios distintos).
    # El orden importa: primero la API, al final el fallback de la SPA.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://dynamo-kw6c.onrender.com/api/*
      - type: rewrite
        source: /csrf/
        destination: https://dynamo-kw6c.onrender.com/csrf/
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
